<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2d8e95">
<title>旅遊平台</title>
<style>
:root{--bg:#eceff3;--surface:#ffffff;--border:#dce1e7;--text:#15202b;--muted:#5b6876;--warn:#a85a00;--warn-soft:#fff3dc;--del:#b93226;--ac:#176a70;--on-ac:#ffffff;
  --it-aside:#f1ede6;--it-line:#e3ddd3;--it-sub:#71818c;--it-code:#637982;--it-sel:#438c85;--it-sel-bg:#e8f8f3;--it-stop-line:#c3d6d2;--it-item-bg:rgba(255,255,255,.79);--it-item-line:#ffffff;--it-white:#ffffff;--it-mixto:#1d1d26;--it-pill-line:#ddd6ca;--it-miss:#9a5d17;--acc-itin:#4fae94;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.12);--mh:52px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--surface:#151c24;--border:#2a3440;--text:#e6ebf0;--muted:#9ba8b5;--warn:#f0aa45;--warn-soft:#3a2a12;--del:#f28a7f;--ac:#5bbab3;--on-ac:#06201f;
  --it-aside:#13181c;--it-line:#2c343b;--it-sub:#95a5ae;--it-code:#95a5ae;--it-sel:#5fb3aa;--it-sel-bg:#16312d;--it-stop-line:#34514c;--it-item-bg:rgba(255,255,255,.04);--it-item-line:transparent;--it-white:#1a2127;--it-mixto:#ffffff;--it-pill-line:#3b464e;--it-miss:#f0b562;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--it-aside);color:var(--text);font:18px/1.55 "Inter","Noto Sans TC","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
/* 版面：電腦左邊行程、右邊地圖；手機上面地圖、下面行程 */
.app{position:fixed;inset:0;display:grid;grid-template-columns:440px minmax(0,1fr);grid-template-rows:var(--mh) minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.top .pill{flex:none;padding:5px 14px;border-radius:12px;background:var(--ac);color:var(--on-ac);font-weight:700;font-size:16px}
.top .ro{flex:none;font-size:13px;color:var(--it-sub);border:1px solid var(--it-pill-line);border-radius:10px;padding:1px 8px}
.top .exp{margin-left:auto;font-size:13.5px;color:var(--it-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.side{grid-row:2;min-height:0;overflow-y:auto;padding:12px 12px 16px;background:var(--it-aside)}
.mapwrap{grid-row:2;position:relative;min-height:0;background:#dfe5e9}
#map{position:absolute;inset:0}
.grab{display:none}
/* 行程資訊區 */
.sec{--acc:var(--acc-itin);border:1px solid color-mix(in srgb,var(--acc) 38%,var(--it-white));border-radius:18px;background:color-mix(in srgb,var(--acc) 9%,var(--it-white));padding:9px}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:2px 4px 6px}
.eyebrow{font-size:17px;font-weight:700;color:color-mix(in srgb,var(--acc) 62%,var(--it-mixto))}
.count{font-size:15px;color:var(--it-sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.trip-bar{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:7px 10px;border:1px solid var(--it-line);border-radius:12px;background:var(--it-white);font-size:15px;min-width:0}
.trip-d{flex:none;padding:1px 7px;border-radius:7px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:color-mix(in srgb,var(--acc) 72%,var(--it-mixto));font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.trip-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.itin{display:flex;flex-direction:column;gap:5px}
.stop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:8px;min-height:38px;padding:5px 10px 5px 8px;border:1px solid var(--it-item-line);border-radius:12px;background:var(--it-item-bg);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.stop.first{border-color:var(--it-stop-line);border-radius:8px;background:var(--it-white)}
.stop:hover{border-color:var(--it-stop-line);background:var(--it-white)}
.stop.on{border-color:var(--it-sel);box-shadow:0 0 0 1px color-mix(in srgb,var(--it-sel) 20%,transparent);background:var(--it-sel-bg)}
.stop:focus-visible{outline:2px solid var(--it-sel);outline-offset:1px}
.stop .nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .tx{font-size:14px;color:var(--it-code);font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap}
.stop .lg{grid-column:2/-1;font-size:13px;color:var(--it-sub);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.no{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--it-code);font-variant-numeric:tabular-nums;white-space:nowrap}
.no i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--it-sub))}
.tag{display:inline-block;padding:0 7px;border-radius:9px;font-size:12px;font-weight:700;line-height:18px}
.tag.drive{background:color-mix(in srgb,var(--it-sel) 16%,transparent);color:var(--it-sel)}
.tag.rail{background:color-mix(in srgb,#6f9ae0 18%,transparent);color:#3d6cc0}
.tag.ctl{background:#fde6e3;color:#b3261e}
.itin-gap{margin:2px 4px;font-size:13px;color:var(--it-miss)}
.lo{margin:0 0 10px;padding:10px 12px;border-radius:16px;background:var(--it-white);border:1px solid #f3c79f}
.lo-h{display:flex;align-items:center;gap:8px;font-size:16px}
.lo-dot{width:12px;height:12px;border-radius:50%;background:#e8710a;flex:none}
.lo.on .lo-dot{animation:lop 1.6s ease-out infinite}
@keyframes lop{0%{box-shadow:0 0 0 0 rgba(232,113,10,.55)}100%{box-shadow:0 0 0 10px rgba(232,113,10,0)}}
.lo-p{margin:4px 0 8px;font-size:13.5px;color:var(--it-sub);line-height:1.5}
.lo-p.err{color:var(--del)}
.lo-a{display:flex;gap:8px}
.lo-go{flex:1;height:42px;border:0;border-radius:12px;background:#e8710a;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.lo-stop{height:42px;padding:0 16px;border:1px solid var(--it-pill-line);border-radius:12px;background:var(--it-white);font-weight:600;cursor:pointer}
.lo.on .lo-go{display:none}
/* 回傳中：卡片收成標題列上的一個小橘點，點開才看狀態、停止 */
.lo-badge{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid #f3c79f;background:var(--it-white);display:grid;place-items:center;padding:0;cursor:pointer}
.lo-badge i{width:12px;height:12px;border-radius:50%;background:#e8710a;animation:lop 1.6s ease-out infinite}
.lo-badge.err{border-color:#f2b8b5}
.lo-badge.err i{background:#d93025;animation:none}
.lo-badge[aria-expanded="true"]{box-shadow:0 0 0 3px rgba(232,113,10,.25)}
.lo-pop{position:fixed;top:calc(var(--mh) + 6px);left:12px;z-index:30;width:min(360px,calc(100vw - 24px));filter:drop-shadow(0 10px 24px rgba(16,32,40,.22))}
.lo-pop .lo{margin:0}
.lo-peers{margin-top:8px;padding-top:8px;border-top:1px solid var(--it-line);font-size:14px;color:var(--it-sub)}
.lo-peers b{color:#9a3f00}
.lo-peers button{border:0;background:none;padding:0;margin:0 6px 0 0;font:inherit;color:#9a3f00;font-weight:700;cursor:pointer;text-decoration:underline}
.locs{position:absolute;left:0;top:0}
.lcm{position:absolute;transform:translate(-9px,-9px);display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none}
.lcm i{width:18px;height:18px;border-radius:50%;background:#e8710a;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);flex:none}
.lcm b{padding:1px 8px;border-radius:7px;background:#e8710a;color:#fff;font-size:13px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.3);line-height:1.45;border:1.5px solid #fff}
.lcm small{margin-left:5px;font-weight:500;color:rgba(255,255,255,.88);font-size:11.5px}
.lcm.old i{background:#9aa5ad}
.lcm.old b{background:#c98a5a}   /* 超過 2 分鐘沒更新或已停止：顏色淡一點 */
.tip{margin:10px 4px 0;font-size:13px;line-height:1.55;color:var(--it-sub)}
.warn{margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
/* 地圖按鈕 */
.tools{position:absolute;top:12px;right:12px;z-index:5;display:flex;flex-direction:column;gap:8px}
.tbtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--text)}
.tbtn.on{background:var(--it-sel);color:#fff}
/* 進度列 */
.prog{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;width:min(560px,calc(100% - 24px));padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:15px}
.pg-tip{color:var(--it-sub)}
.pg-h{display:flex;align-items:center;gap:8px;min-width:0}
.pg-no{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-weight:700;font-size:12.5px}
.pg-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--it-sub)}
.pg-t b{color:var(--text)}
.pg-t small{font-size:13px}
.pg-x{flex:none;border:1px solid var(--it-pill-line);background:var(--it-white);border-radius:9px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--it-sub)}
.pg-l{margin-top:4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.pg-l b{font-size:17px}
.pg-sub{color:var(--it-sub);font-size:14px}
.pg-sub .nw{white-space:nowrap}
@media (max-width:899px){.prog{position:static;transform:none;width:auto;margin:0 0 10px;box-shadow:none;border:1px solid var(--it-line)}}
.tbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 臨時畫線的文字、長度標籤 */
.drawlbls{position:absolute;left:0;top:0}
.dlb{position:absolute;transform:translate(9px,-50%);white-space:nowrap;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--dc);font-size:12.5px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2);pointer-events:none}
.dlb.top{transform:translate(-50%,-135%)}
.dlb.dtx{transform:translate(-50%,-50%);padding:2px 9px;border:2px solid var(--dc);border-radius:8px;font-size:16px}
/* 錯誤／載入畫面 */
.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);padding:24px;text-align:center}
.cover .box{max-width:360px}
.cover h1{font-size:21px;margin:12px 0 6px}
.cover p{color:var(--muted);margin:0;font-size:16px}
.cover .ic{width:56px;height:56px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--it-sel-bg);color:var(--it-sel);font-size:28px}
.gate .ic{background:#fde9d7;color:#e8710a}
.gate #gateTxt{margin:0 0 16px;line-height:1.6}
.gate #gateTxt.err{color:var(--del)}
.gate-go{width:100%;max-width:300px;height:48px;font-size:17px}
.gate-go:disabled{opacity:.6}
.gate-exp{margin-top:12px!important;font-size:13.5px!important}
.vtoast{position:fixed;left:50%;top:calc(var(--mh) + 12px);transform:translateX(-50%);z-index:40;max-width:calc(100vw - 24px);padding:9px 14px;border-radius:12px;background:#15202b;color:#fff;font-size:14.5px;box-shadow:var(--shadow)}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--it-line);border-top-color:var(--it-sel);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:899px){
  :root{--mh:48px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--mh) minmax(0,1fr) auto}
  .top .pill{font-size:15px;padding:4px 12px}
  .side{grid-row:3;height:46dvh;border-radius:20px 20px 0 0;margin-top:-18px;position:relative;z-index:6;box-shadow:0 -6px 20px rgba(16,32,40,.12);padding:6px 12px calc(14px + env(safe-area-inset-bottom));transition:height .28s ease}
  .side.big{height:82dvh}
  .side.min{height:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom))}   /* 收起：只留把手、進度列（沒選站時留一行摘要） */
  .side.min>:not(.grab):not(#prog):not(.mini){display:none!important}
  .side.min #prog{margin-bottom:0}
  .side.min.hasprog .mini{display:none}
  .mini{display:none}
  .side.min .mini{display:flex;align-items:baseline;gap:8px;padding:2px 4px 4px;cursor:pointer}
  .mini b{flex:none;white-space:nowrap;font-size:16px;color:color-mix(in srgb,var(--acc-itin) 62%,var(--it-mixto))}
  .mini span{flex:1;min-width:0;font-size:14px;color:var(--it-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--it-pill-line);margin:4px auto 10px;border:0;padding:0;cursor:pointer;position:relative}
  .grab::before{content:"";position:absolute;inset:-14px -40px}
  .tools{top:10px;right:10px}
  .mapwrap{margin-bottom:18px}
}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <header class="top"><span class="pill">旅遊平台</span><span class="ro">只能看</span><button class="lo-badge" id="loBadge" hidden aria-expanded="false" title="正在回傳你的位置（點一下查看或停止）" aria-label="正在回傳你的位置，點一下查看或停止"><i></i></button><span class="exp" id="exp"></span></header>
  <div class="lo-pop" id="loPop" hidden></div>
  <aside class="side" id="side">
    <button class="grab" id="grab" aria-label="展開或收起行程資訊"></button>
    <div class="mini" id="mini"><b>行程資訊區</b><span id="miniSum"></span></div>
    <section class="lo" id="lo" hidden>
      <div class="lo-h"><span class="lo-dot" id="loDot"></span><b id="loTitle">分享人請你回傳位置</b></div>
      <p class="lo-p" id="loTxt">按下後，你的位置大約每 10 秒傳給分享人，只在這個頁面開著時傳送；按「停止」或連結到期就不再傳。</p>
      <div class="lo-a"><button class="lo-go" id="loGo">回傳我的位置</button><button class="lo-stop" id="loStop" hidden>停止</button></div>
      <div class="lo-peers" id="loPeers" hidden></div>
    </section>
    <section class="sec">
      <div class="sec-h"><span class="eyebrow">行程資訊區</span><span class="count" id="sum"></span></div>
      <div class="trip-bar"><span class="trip-d" id="tdate" hidden></span><b class="trip-n" id="tname"></b></div>
      <div class="itin" id="itin"></div>
    </section>
    <p class="warn" id="warn" hidden></p>
    <p class="tip" id="tip">點一站，地圖會移到「上一站 → 這一站」的路線；按地圖右上角的框框看整條路線。</p>
  </aside>
  <div class="mapwrap"><div id="map" aria-label="地圖"></div>
    <div class="prog" id="prog" hidden></div>
    <div class="tools"><button class="tbtn" id="meBtn" hidden title="回到我的位置" aria-label="回到我的位置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button><button class="tbtn" id="fitBtn" title="看整條路線" aria-label="看整條路線"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="tbtn" id="layBtn" title="換成衛星空照" aria-label="切換地圖或衛星">衛星</button></div>
  </div>
</div>
<div class="vtoast" id="vtoast" hidden></div>
<div class="cover gate" id="gate" hidden><div class="box"><div class="ic">📍</div><h1>回傳我的位置後才可查看</h1><p id="gateTxt"></p><button class="lo-go gate-go" id="gateGo">回傳我的位置</button><p class="gate-exp" id="gateExp"></p></div></div>
<div class="cover" id="cover"><div class="box"><div class="spin"></div><p style="margin-top:14px">載入路線中…</p></div></div>
<script>
'use strict';
/* 分享頁（只能看）：路線資料就在連結 # 後面（gzip＋base64url），打開時在 Google 地圖上重新規劃路線。 */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
const WD='日一二三四五六';
const tripDate=d=>{const t=new Date(d+'T00:00:00');return `${t.getMonth()+1}/${t.getDate()}（${WD[t.getDay()]}）`;};
const isStart=s=>s.no==='出發'||s.no==='起';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function dist(a,b){const R=6371000,r=Math.PI/180,x=(b[1]-a[1])*r*Math.cos((a[0]+b[0])/2*r),y=(b[0]-a[0])*r;return Math.hypot(x,y)*R;}
const V={d:null,stops:[],legs:[],sel:-1,layer:'map',bounds:null,dead:false};
let map,iw;

function cover(icon,title,text){$('#cover').hidden=false;$('#cover .box').innerHTML=`<div class="ic">${icon}</div><h1>${esc(title)}</h1><p>${esc(text)}</p>`;}
function die(kind){
  V.dead=true;$('#app').hidden=true;$('#gate').hidden=true;if(typeof LO!=='undefined'&&LO.on) loStop(false);
  if(kind==='exp') cover('⏱','這個連結已經失效','請跟分享給你的人要新的連結。');
  else if(kind==='bad') cover('！','連結不完整','請確認連結有完整複製（包含 # 後面的部分）。');
  else if(kind==='old') cover('！','這個瀏覽器太舊','請更新手機系統，或改用最新版的 Chrome、Safari 開啟。');
  else if(kind==='key') cover('！','地圖暫時無法顯示','地圖金鑰有問題，請告訴分享給你的人。');
  else cover('！','暫時讀不到路線','請檢查網路後重新整理。');
}
async function boot(){
  const h=location.hash.slice(1);
  if(!window.DecompressionStream||!crypto?.subtle) return die('old');
  const unzip=async u8=>JSON.parse(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  let d;
  if(h.startsWith('s/')){   // 短連結：#s/代碼/鑰匙/Worker 主機，資料從分享人自己的 Cloudflare 讀回再解密
    const [,sid,key,host]=h.split('/');
    if(!/^[a-z0-9]{6,24}$/.test(sid||'')||!/^[\w-]{20,}$/.test(key||'')||!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(host||'')) return die('bad');
    let r;try{r=await fetch(`https://${host}/blob/${sid}`,{cache:'no-store'});}catch{return die('net');}
    if(r.status===404||r.status===410) return die('exp');
    if(!r.ok) return die('net');
    try{const j=await r.json(),[iv,ct]=String(j.data).split('.');V.short={host,sid,key,raw:j.data};
      const k=await crypto.subtle.importKey('raw',b64(key),'AES-GCM',false,['decrypt']);
      d=await unzip(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(iv)},k,b64(ct))));}catch{return die('bad');}
  }else{

function progMatch(upto){   // 只往前找：去程、回程走同一條路時，不會跳回去程
  const me=LO.pos?[LO.pos.lat,LO.pos.lng]:null;if(!me||!PG.ready) return null;
  const tol=Math.max(60,Math.min(LO.pos.acc||0,200));let best=null;const near=[];
  const from=PG.cur===null?-Infinity:PG.cur-150;let fwd=null;
  for(const sg of PG.segs){const r=proj(me,sg);if(!best||r.d<best.d) best=r;if(r.s>=from&&(upto===undefined||r.s<=upto)&&(!fwd||r.d<fwd.d)) fwd=r;if(r.d<=tol) near.push(r);}
  if(!near.length) return {on:false,best:fwd||best};   // 不在路線上：找「目前進度到目標站」之間最近的路段，不會對到回程
  if(PG.cur===null) PG.cur=Math.min(...near.map(r=>r.s));
  else{const fwd=near.filter(r=>r.s>=PG.cur-150);PG.cur=fwd.length?Math.min(...fwd.map(r=>r.s)):near.reduce((a,r)=>Math.abs(r.s-PG.cur)<Math.abs(a.s-PG.cur)?r:a).s;}
  return {on:true,s:PG.cur,best};
}
function legMinutes(i,kind){   // 這一段的分鐘數：開車段用分享時存的一般／燈控；高鐵段用站點時間相減
  const g=V.d.legs[i];if(!g) return null;
  if(g.m==='r'){const st=V.stops.find(s=>s.g===i&&isStart(s))||V.stops.find(s=>s.g===i-1&&!isStart(s)),en=V.stops.find(s=>s.g===i&&!isStart(s));const a=mins(st?.d||st?.a),b=mins(en?.a);return a!==null&&b!==null?((b-a+1440)%1440):null;}
  const v=kind==='c'?(g.mc??(g.ctl?g.min:null)):(g.mn??(g.ctl?null:g.min));return Number.isFinite(v)?v:null;
}
function etaMin(from,to,kind){   // 剩下的距離跨過哪些段，就照各段規劃時間按比例加起來
  let t=0;
  for(let i=0;i<PG.legS.length;i++){const a=Math.max(from,PG.legS[i]),b=Math.min(to,PG.legE[i]),len=PG.legE[i]-PG.legS[i];if(b<=a||len<=0) continue;const m=legMinutes(i,kind);if(m===null) return null;t+=m*(b-a)/len;}
  return Math.max(1,Math.round(t));
}
function progLink(a,b){   // 不在路線上：從藍點到路線上最近的點畫一條灰色虛線
  if(!map) return;const path=a&&b?[LL(a),LL(b)]:[];
  if(!PG.link) PG.link=new google.maps.Polyline({map,path,strokeOpacity:0,icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,strokeColor:'#6b7780',scale:3},offset:'0',repeat:'12px'}],clickable:false,zIndex:30});
  else PG.link.setPath(path);
}
function liveSpeed(m){   // 即時（推估）：最近約 3 分鐘在路線上實際前進的平均速度（含停紅燈），公尺／秒
  const now=Date.now();
  if(m&&m.on&&LO.posT&&LO.posT!==PG.lastT){PG.lastT=LO.posT;PG.hist.push({t:LO.posT,s:m.s});}
  PG.hist=PG.hist.filter(h=>now-h.t<=180e3);
  if(PG.hist.length<2) return {wait:true};
  const a=PG.hist[0],b=PG.hist.at(-1),dt=(b.t-a.t)/1000,ds=b.s-a.s;
  if(dt<60) return {wait:true};
  const v=ds/dt;
  if(v>45){PG.hist=[b];return {wait:true};}   // 超過時速 160 公里：GPS 跳動，重新累積
  if(v<1) return {stop:true};   // 不到時速 3.6 公里：當作停著，不顯示
  return ds<200?{wait:true}:{v};
}
function progRender(){
  const el=$('#prog');if(!el) return;
  progLink(null,null);
  $('#tip').textContent=LO.on?'點一站，看你離那一站多遠；地圖會跟著你移動，拖動地圖後按右上角「◎」回到自己的位置。':'點一站，地圖會移到「上一站 → 這一站」的路線；按地圖右上角的框框看整條路線。';
  const on=LO.on&&V.built;el.hidden=!on;$('#side').classList.toggle('hasprog',on);if(!on) return;
  const T=V.stops[PG.tg];
  if(!T){el.innerHTML='<span class="pg-tip">點一站，看你離那一站多遠</span>';return;}
  const tm=T.a&&T.d?`${hhmm2(T.a)} 到`:T.a?`${hhmm2(T.a)} 到`:T.d?`${hhmm2(T.d)} 出發`:'';
  const c=V.d.legs[T.g]?.c||'#2d8e95',no=isStart(T)?(T.no==='出發'?'出發':'起'):T.no;
  let line='';
  if(!PG.ready) line='<span class="pg-sub">路線載入中…</span>';
  else if(!LO.pos) line='<span class="pg-sub">定位中…</span>';
  else{
    const sT=stopS(T),m=progMatch(sT);
    if(m.on){
      const sp=liveSpeed(m);
      if(sT>m.s+20){const n=etaMin(m.s,sT,'n'),cc=etaMin(m.s,sT,'c');
        const plan=n!==null&&cc!==null&&n!==cc?`照規劃 一般約 ${n} 分／燈控約 ${cc} 分`:n!==null?`照規劃 約 ${n} 分`:cc!==null?`照規劃 約 ${cc} 分`:'';
        const live=sp.v?`即時約 ${Math.max(1,Math.round((sT-m.s)/sp.v/60))} 分（推估）`:sp.wait?'即時計算中':'';
        const t=[plan,live].filter(Boolean).map(x=>`<span class="nw">${x}</span>`).join('　');
        line=`<b>沿路線還有 ${fmtD(sT-m.s)}</b>${t?`<span class="pg-sub">${t}</span>`:''}`;}
      else if(Math.abs(sT-m.s)<=20) line='<b>就在這一站附近</b>';
      else line=`<b>那一站在你後面</b><span class="pg-sub">沿路線往回約 ${fmtD(m.s-sT)}</span>`;
    }else{
      const b=m.best;progLink([LO.pos.lat,LO.pos.lng],b.q);
      line=`<b>不在路線上・離路線約 ${fmtD(b.d)}</b><span class="pg-sub">${sT>=b.s?`回到路線後，到 ${esc(no)} 還有 ${fmtD(sT-b.s)}`:`${esc(no)} 在回到路線處的後面，沿路線往回約 ${fmtD(b.s-sT)}`}</span>`;
    }
  }
  el.innerHTML=`<div class="pg-h"><span class="pg-no" style="--c:${c}">${esc(no)}</span><span class="pg-t">前往 <b>${esc(T.n)}</b>${tm?`<small> · 預定 ${tm}</small>`:''}</span><button class="pg-x" id="pgX" aria-label="取消選擇">取消</button></div><div class="pg-l">${line}</div>`;
}
function progPick(s){   // 點一站：選為目標（再點一次同一站＝取消）
  PG.tg=PG.tg===s.i?-1:s.i;V.sel=PG.tg>=0&&!isStart(s)?s.g:-1;itinHTML();styleLegs();progRender();
  if(innerWidth<900) $('#side').classList.remove('big');
}
function progPlace(){   // 電腦：地圖下方；手機：行程資訊區最上面
  const el=$('#prog');if(!el) return;const wide=innerWidth>=900,box=wide?$('.mapwrap'):$('#side');
  if(wide){if(el.parentElement!==box) box.append(el);}else{const ref=$('#side .sec');if(el.nextElementSibling!==ref) $('#side').insertBefore(el,ref);}
}
/* 地圖跟著自己的位置移動；拖動後停止，按「◎」回來 */
function followMe(force){
  if(!map||!LO.pos) return;
  const ll=LL([LO.pos.lat,LO.pos.lng]);
  if(force||!V.followed){map.setCenter(ll);if(map.getZoom()<16) map.setZoom(16);V.followed=true;}else map.panTo(ll);
}
function meBtnRender(){const b=$('#meBtn');if(!b) return;b.hidden=!(LO.on&&V.built);b.classList.toggle('on',!!V.follow);b.title=V.follow?'地圖跟著你移動中':'回到我的位置';}

/* ---------- 回傳我的位置（分享人有開啟時才有）：對方自己按下才開始，頁面開著時約每 10 秒傳一次 ---------- */
const LO={peers:[],peerT:0,pview:null,skew:0,on:false,watch:null,pos:null,sent:null,sentT:0,timer:0,lock:null,me:null,acc:null,busy:false};
function loDev(){let v='';try{v=localStorage.getItem('shareDev')||'';}catch{}if(!/^[a-z0-9]{12}$/.test(v)){v=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b&31]).join('');try{localStorage.setItem('shareDev',v);}catch{}}return v;}
function loInit(){
  if(LO.inited) return;LO.inited=true;
  $('#lo').hidden=false;$('#loTitle').textContent='分享人請你回傳位置';
  if(V.d.lo.m) $('#loTxt').textContent='按下後，你的位置大約每 10 秒傳給分享人，也會讓同一趟的其他人看到；你也會看到他們的位置。只在這個頁面開著時傳送；按「停止」或連結到期就不再傳。';
  $('#loPeers').onclick=e=>{const b=e.target.closest('[data-pk]');if(!b) return;const p=LO.peers[+b.dataset.pk];if(p){map.panTo(LL([p.lat,p.lng]));if(map.getZoom()<15) map.setZoom(15);}};
  $('#loGo').onclick=loStart;
  $('#loBadge').onclick=e=>{e.stopPropagation();loPop($('#loPop').hidden);};
  document.addEventListener('click',e=>{if(!$('#loPop').hidden&&!e.target.closest('#loPop,#loBadge')) loPop(false);});$('#loStop').onclick=()=>loStop(true,'已停止回傳位置。');
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LO.on){loWake();loSend(true);}});
}
function loMsg(t,err){const p=$('#loTxt');p.textContent=t;p.classList.toggle('err',!!err);$('#loBadge').classList.toggle('err',!!err&&LO.on);if(!$('#gate').hidden) gateTxt(t,err);}
/* 要先回傳位置才看得到：還沒回傳（或停止）時只顯示這個畫面 */
const GATE_TXT='分享人請你回傳位置。按下並允許定位後，才會顯示路線和行程；你的位置大約每 10 秒傳給分享人，只在這個頁面開著時傳送，停止回傳就不再顯示。';
function gateTxt(t,err){const p=$('#gateTxt');p.textContent=t||GATE_TXT;p.classList.toggle('err',!!err);}
function gateShow(msg,err){
  V.shown=false;$('#app').hidden=true;$('#gate').hidden=false;gateTxt(msg,err);
  $('#gateExp').textContent=`連結到 ${when(V.d.exp)} 失效`;
  const b=$('#gateGo');b.disabled=false;b.textContent=LO.everSent?'重新回傳我的位置':'回傳我的位置';b.onclick=()=>{b.disabled=true;b.textContent='定位中…';loStart();};
}
function gateReveal(){
  V.shown=true;$('#gate').hidden=true;$('#app').hidden=false;
  if(!V.built) build();
  loMe();if(V.d.lo.m) setTimeout(loPeers,300);
}
function loDock(on){   // 回傳中：卡片搬進小橘點的彈出框（平常收起來）；停止後搬回行程資訊上方
  const card=$('#lo'),pop=$('#loPop'),badge=$('#loBadge');
  if(on){pop.append(card);badge.hidden=false;loPop(false);}
  else{$('#side').insertBefore(card,$('#side .sec'));badge.hidden=true;badge.classList.remove('err');pop.hidden=true;badge.setAttribute('aria-expanded','false');}
}
function loPop(open){$('#loPop').hidden=!open;$('#loBadge').setAttribute('aria-expanded',String(open));}
function loStart(){
  V.follow=true;V.followed=false;
  if(!navigator.geolocation) return loMsg('這個瀏覽器不能定位。',true);
  if(!isSecureContext) return loMsg('要用 https 網址開啟才能定位。',true);
  LO.on=true;LO.sent=null;LO.sentT=0;loDock(true);$('#lo').classList.add('on');$('#loStop').hidden=false;$('#loTitle').textContent='正在回傳你的位置';loMsg('定位中…');
  LO.watch=navigator.geolocation.watchPosition(loPos,loErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  clearInterval(LO.timer);LO.timer=setInterval(()=>{loSend(false);loPeers();},10000);
  loWake();
}
async function loStop(tell,msg,err){
  const was=LO.on;LO.on=false;clearInterval(LO.timer);if(LO.watch!==null) navigator.geolocation.clearWatch(LO.watch);LO.watch=null;
  try{LO.lock?.release();}catch{}LO.lock=null;
  LO.peers=[];loPeerRender();loDock(false);V.follow=false;progRender();meBtnRender();
  $('#lo').classList.remove('on');$('#loStop').hidden=true;$('#loTitle').textContent='分享人請你回傳位置';$('#loGo').textContent='重新回傳我的位置';
  loMsg(msg||'',err);
  if(V.gated&&!V.dead) gateShow(msg||'',err);
  if(tell&&was){const lo=V.d.lo;try{await fetch(lo.u.replace(/\/+$/,'')+'/loc/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lo.id,w:lo.w,dev:loDev()}),keepalive:true});}catch{}}
}
async function loWake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&!LO.lock){LO.lock=await navigator.wakeLock.request('screen');LO.lock.addEventListener('release',()=>{LO.lock=null;});}}catch{}}
function loErr(e){
  if(e.code===1) loStop(false,'沒有定位權限：請在瀏覽器或手機設定裡，允許這個網站使用位置，再按一次。'+(/\bLine\//i.test(navigator.userAgent)?'在 LINE 裡開的話，請改用 Safari 或 Chrome 開啟。':''),true);
  else if(!LO.pos) loMsg('暫時抓不到位置：到比較空曠的地方，或確認手機的定位有打開。',true);
}
function loPos(p){
  if(!LO.on) return;
  const c=p.coords;LO.posT=Date.now();LO.pos={lat:c.latitude,lng:c.longitude,acc:c.accuracy||0,hd:Number.isFinite(c.heading)?c.heading:null,sp:Number.isFinite(c.speed)?c.speed:null};
  loMe();
  const moved=LO.sent?dist([LO.sent.lat,LO.sent.lng],[LO.pos.lat,LO.pos.lng]):1e9;
  const gap=Date.now()-LO.sentT;
  if(!LO.sent||(moved>20&&gap>=3000)) loSend(true);
  else if(moved>20){clearTimeout(LO.soon);LO.soon=setTimeout(()=>loSend(true),3000-gap);}   // 剛傳過：3 秒後補傳
}
function loMe(){   // 自己的藍點（地圖建好後才畫）
  if(!map||!LO.pos) return;
  if(V.follow) followMe();progRender();meBtnRender();
  const ll=LL([LO.pos.lat,LO.pos.lng]);
  if(!LO.me){LO.me=new google.maps.Marker({map,position:ll,clickable:false,zIndex:90,title:'你的位置',icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#1a73e8',fillOpacity:1,strokeColor:'#ffffff',strokeWeight:3}});
    LO.acc=new google.maps.Circle({map,center:ll,radius:LO.pos.acc,strokeColor:'#1a73e8',strokeWeight:1,strokeOpacity:.35,fillColor:'#1a73e8',fillOpacity:.1,clickable:false,zIndex:5});}
  else{LO.me.setPosition(ll);LO.acc.setCenter(ll);LO.acc.setRadius(LO.pos.acc);}
}
async function loSend(force){   // 每 10 秒（或移動超過 20 公尺）送一次最新位置
  if(!LO.on||!LO.pos||LO.busy) return;
  if(!force&&Date.now()-LO.sentT<9000) return;
  const lo=V.d.lo;LO.busy=true;
  try{
    const r=await fetch(lo.u.replace(/\/+$/,'')+'/loc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lo.id,w:lo.w,dev:loDev(),...LO.pos})});
    if(r.status===410) return loStop(false,'連結已經到期，已停止回傳位置。',true);
    if(r.status===403) return loStop(false,'這個連結不能回傳位置（分享人可能已經停止接收）。',true);
    if(!r.ok) throw new Error(String(r.status));
    LO.sent={...LO.pos};LO.sentT=Date.now();LO.everSent=true;
    if(V.gated&&!V.shown) gateReveal();else if(V.d.lo.m&&Date.now()-LO.peerT>8000) setTimeout(loPeers,300);
    const d=new Date();loMsg(`最後傳送 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}${LO.pos.acc>150?`（定位誤差約 ${Math.round(LO.pos.acc)} 公尺）`:''}。請讓這個頁面保持開著；鎖螢幕或切到別的 App 會暫停。`);
  }catch{if(LO.on) loMsg('傳送失敗，會自動再試；請確認網路。',true);}
  finally{LO.busy=false;}
}
/* 同一趟互相看到：自己正在回傳時，每 10 秒讀一次同一趟其他人的位置 */
const agoTxt=t=>{const s=Math.max(0,Math.round((Date.now()+LO.skew-t)/1000));return s<20?'剛剛':s<60?`${s} 秒前`:s<3600?`${Math.floor(s/60)} 分鐘前`:new Date(t).toTimeString().slice(0,5);};
async function loPeers(){
  if(!LO.on||!V.d.lo?.m||!LO.sent) return;
  LO.peerT=Date.now();const lo=V.d.lo;
  try{const r=await fetch(lo.u.replace(/\/+$/,'')+'/peers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lo.id,w:lo.w,dev:loDev()})});
    if(!r.ok) return;const j=await r.json();if(!LO.on) return;LO.skew=(+j.now||Date.now())-Date.now();
    LO.peers=(j.peers||[]).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));loPeerRender();}catch{}
}
function loPeerRender(){
  const box=$('#loPeers'),ps=LO.peers,old=p=>p.stopped||Date.now()+LO.skew-p.t>120e3;
  box.hidden=!(LO.on&&V.d.lo?.m);
  if(!box.hidden) box.innerHTML=ps.length?'同一趟：'+ps.map((p,i)=>`<button data-pk="${i}">${esc(p.name)}</button><small>${p.stopped?'已停止':agoTxt(p.t)}</small>`).join('　'):'同一趟的其他人還沒開始回傳位置。';
  if(!LO.pview&&ps.length){
    class P extends google.maps.OverlayView{
      onAdd(){this.el=document.createElement('div');this.el.className='locs';this.getPanes().floatPane.appendChild(this.el);}
      onRemove(){this.el?.remove();}
      draw(){const pr=this.getProjection?.();if(!pr||!this.el) return;this.el.innerHTML=LO.peers.map(p=>{const q=pr.fromLatLngToDivPixel(LL([p.lat,p.lng]));return `<div class="lcm ${old(p)?'old':''}" style="left:${q.x}px;top:${q.y}px"><i></i><b>${esc(p.name)}<small>${p.stopped?'已停止':agoTxt(p.t)}</small></b></div>`;}).join('');}
    }
    LO.pview=new P();LO.pview.setMap(map);
  }
  LO.pview?.draw();
}
boot().catch(()=>die('net'));
</script>
