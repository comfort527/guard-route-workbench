<style>
:root{--bg:#eceff3;--card:#fff;--line:#dce1e7;--text:#15202b;--muted:#5b6876;--pri:#1f5fcf;--err:#b93226}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:17px/1.5 "Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
form{width:min(380px,100%);padding:28px 26px 22px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 18px 50px -18px rgba(16,24,40,.35);text-align:center}

h1{margin:0 0 4px;font-size:23px}
p{margin:0 0 18px;color:var(--muted);font-size:15px}
input[type=password]{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:18px}
input[type=password]:focus{outline:3px solid color-mix(in srgb,var(--pri) 30%,transparent);border-color:var(--pri)}
label{display:flex;align-items:center;gap:8px;margin:14px 2px 18px;font-size:15px;color:var(--muted);cursor:pointer;text-align:left}
label input{width:18px;height:18px;margin:0;accent-color:var(--pri)}
button{width:100%;height:46px;border:0;border-radius:999px;background:var(--pri);color:#fff;font:inherit;font-size:18px;font-weight:600;cursor:pointer}
button:disabled{opacity:.7;cursor:default}
#msg{min-height:1.5em;margin-top:12px;font-size:15px;color:var(--err)}

<script>
(function(){var P=JSON.parse(document.getElementById('payload').textContent),K='guard-route-unlock:v1',$=function(id){return document.getElementById(id);};
function d64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function e64(b){var u=new Uint8Array(b),s='';for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);return btoa(s);}
async function derive(pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:d64(P.salt),iterations:P.iter},base,256);}
async function open(raw){var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);var gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.iv)},key,d64(P.data));var html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}
function saved(){try{return JSON.parse(localStorage.getItem(K)||'null');}catch(e){return null;}}
$('f').onsubmit=async function(e){e.preventDefault();var pw=$('pw').value;if(!pw) return;$('go').disabled=true;$('msg').style.color='inherit';$('msg').textContent='解密中…';
  try{var raw=await derive(pw);await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);if($('rem').checked){try{localStorage.setItem(K,JSON.stringify({salt:P.salt,key:e64(raw)}));}catch(x){}}await open(raw);}
  catch(x){$('go').disabled=false;$('msg').style.color='';$('msg').textContent='密碼錯誤';$('pw').select();}};
(async function(){if(!window.crypto||!crypto.subtle||!window.DecompressionStream){$('f').hidden=false;$('msg').textContent='這個瀏覽器不支援，請改用新版 Chrome、Edge 或 Safari';$('go').disabled=true;return;}
  var s=saved();if(s&&s.salt===P.salt){try{await open(d64(s.key));return;}catch(x){}}
  if(s){try{localStorage.removeItem(K);}catch(x){}}
  $('f').hidden=false;$('pw').focus();})();})();
</script></body></html>
