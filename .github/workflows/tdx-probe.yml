name: 檢查 TDX 金鑰與資料大小
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 列出 Secret 名稱（不含內容）
        env:
          ALL: ${{ toJSON(secrets) }}
        run: python3 -c "import json,os;print('repo 裡的 Secret 名稱：',sorted(k for k in json.loads(os.environ['ALL']) if k!='github_token'))"
      - name: 測試 TDX
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 tools/tdx_probe.py
